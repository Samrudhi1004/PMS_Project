<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Product - Product Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .form-card {
            border: none;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.95);
        }
        .form-header {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            color: white;
            border-radius: 20px 20px 0 0;
            padding: 2.5rem;
            text-align: center;
        }
        .btn-submit {
            background: linear-gradient(135deg, #28a745 0%, #20c997 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 40px;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(40, 167, 69, 0.4);
        }
        .btn-cancel {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            border: none;
            border-radius: 25px;
            padding: 12px 30px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-cancel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 117, 125, 0.4);
        }
        .form-control {
            border-radius: 15px;
            padding: 15px 20px;
            border: 2px solid #e9ecef;
            font-size: 1rem;
            transition: all 0.3s ease;
        }
        .form-control:focus {
            border-color: #28a745;
            box-shadow: 0 0 0 0.2rem rgba(40, 167, 69, 0.25);
        }
        .form-floating > label {
            padding: 1rem 1.25rem;
            font-weight: 500;
        }
        .input-group-text {
            border-radius: 15px 0 0 15px;
            border: 2px solid #e9ecef;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
        }
        .form-label {
            font-weight: 600;
            color: #495057;
            margin-bottom: 0.5rem;
        }
        .breadcrumb-custom {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 1rem;
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-6">
                <nav aria-label="breadcrumb" class="breadcrumb-custom">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item">
                            <a href="{% url 'display' %}" class="text-decoration-none">
                                <i class="fas fa-home me-1"></i>Dashboard
                            </a>
                        </li>
                        <li class="breadcrumb-item active" aria-current="page">
                            <i class="fas fa-plus me-1"></i>Add Product
                        </li>
                    </ol>
                </nav>

                <div class="card form-card">
                    <div class="form-header">
                        <i class="fas fa-plus-circle fa-3x mb-3"></i>
                        <h2 class="mb-0">Add New Product</h2>
                        <p class="mb-0 opacity-75">Fill in the details to add a product to your inventory</p>
                    </div>
                    <div class="card-body p-5">
                        {% if messages %}
                            {% for message in messages %}
                                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                    <i class="fas fa-info-circle me-2"></i>{{ message }}
                                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                </div>
                            {% endfor %}
                        {% endif %}

                        <form method="post" enctype="multipart/form-data" novalidate>
                            {% csrf_token %}

                            <div class="row">
                                                                <div class="col-12 mb-4">
                                                                    <label for="image" class="form-label">
                                                                        <i class="fas fa-image me-2 text-info"></i>Product Image
                                                                    </label>
                                                                    <input class="form-control" type="file" id="image" name="image" accept="image/*">
                                                                </div>
                                <div class="col-12 mb-4">
                                    <label for="name" class="form-label">
                                        <i class="fas fa-tag me-2 text-success"></i>Product Name
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-tag"></i>
                                        </span>
                                        <input type="text" class="form-control" id="name" name="name"
                                               placeholder="Enter product name" required>
                                    </div>
                                </div>

                                <div class="col-12 mb-4">
                                    <label for="description" class="form-label">
                                        <i class="fas fa-align-left me-2 text-info"></i>Description
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-align-left"></i>
                                        </span>
                                        <textarea class="form-control" id="description" name="description"
                                                  rows="4" placeholder="Enter product description" required></textarea>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="price" class="form-label">
                                        <i class="fas fa-rupee-sign me-2 text-warning"></i>Price (Rs)
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-rupee-sign"></i>
                                        </span>
                                        <input type="number" step="0.01" min="0" class="form-control"
                                               id="price" name="price" placeholder="0.00" required>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="quantity" class="form-label">
                                        <i class="fas fa-cubes me-2 text-primary"></i>Quantity
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-cubes"></i>
                                        </span>
                                        <input type="number" min="0" class="form-control"
                                               id="quantity" name="quantity" placeholder="0" required>
                                    </div>
                                </div>

                                <div class="col-md-6 mb-4">
                                    <label for="category" class="form-label">
                                        <i class="fas fa-th-large me-2 text-secondary"></i>Category
                                    </label>
                                    <div class="input-group">
                                        <span class="input-group-text">
                                            <i class="fas fa-th-large"></i>
                                        </span>
                                        <select class="form-select" id="category" name="category" required>
                                            <option value="">Select Category</option>
                                            <option value="electronics">Electronics</option>
                                            <option value="clothing">Clothing</option>
                                            <option value="books">Books</option>
                                            <option value="home">Home & Kitchen</option>
                                            <option value="sports">Sports & Fitness</option>
                                            <option value="beauty">Beauty & Personal Care</option>
                                            <option value="toys">Toys & Games</option>
                                            <option value="automotive">Automotive</option>
                                            <option value="other">Other</option>
                                        </select>
                                    </div>
                                </div>
                            </div>

                            <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
                                <a href="{% url 'display' %}" class="btn btn-cancel me-md-2">
                                    <i class="fas fa-times me-2"></i>Cancel
                                </a>
                                <button type="submit" class="btn btn-submit">
                                    <i class="fas fa-save me-2"></i>Add Product
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
